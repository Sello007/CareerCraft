<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCraft - Live Tech Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 p-10">

    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-extrabold text-blue-950 mb-2">Live Engineering Portfolio</h2>
        <p class="text-gray-600 mb-8">Pulling live projects directly from GitHub using the GitHub REST API.</p>

        <!-- This is where the JavaScript will inject the projects -->
        <div id="github-repos" class="grid md:grid-cols-2 gap-6">
            <p class="text-gray-500 animate-pulse">Loading live projects...</p>
        </div>
    </div>

    <!-- The Javascript Magic -->
    <script>
        // Makuks, change 'octocat' to any GitHub username you want to display!
        const githubUsername = 'octocat'; 
        
        fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated&per_page=4`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('github-repos');
                container.innerHTML = ''; // Clear the loading text

                data.forEach(repo => {
                    const repoCard = `
                        <div class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm hover:shadow-md transition">
                            <h3 class="font-bold text-lg text-blue-900 mb-2">${repo.name}</h3>
                            <p class="text-sm text-gray-600 mb-4 h-10 overflow-hidden">${repo.description || 'No description provided.'}</p>
                            <div class="flex justify-between items-center">
                                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded">${repo.language || 'Tech'}</span>
                                <a href="${repo.html_url}" target="_blank" class="text-sm font-semibold text-blue-600 hover:text-blue-800">View Source &rarr;</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += repoCard;
                });
            })
            .catch(error => {
                document.getElementById('github-repos').innerHTML = '<p class="text-red-500">Error loading repositories.</p>';
            });
    </script>
</body>
</html>
